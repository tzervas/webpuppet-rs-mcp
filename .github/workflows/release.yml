name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag name"
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - name: Checkout webpuppet-rs dependency
        uses: actions/checkout@v7
        with:
          repository: tzervas/webpuppet-rs
          path: webpuppet-rs
      - uses: actions/checkout@v7
        with:
          path: webpuppet-rs-mcp
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Pre-release checks
        working-directory: webpuppet-rs-mcp
        run: bash scripts/check.sh
      - name: Build release
        working-directory: webpuppet-rs-mcp
        run: cargo build --release --all-features
      - name: Create GitHub Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
