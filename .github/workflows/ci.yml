name: CI

# Manual only — run the same checks locally via ./scripts/check.sh
on:
  push:
    branches:
      - main
      - dev
      - develop
  pull_request:
    branches:
      - main
      - dev
      - develop
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and Test (local parity)
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 30
    steps:
      - name: Checkout webpuppet-rs dependency
        uses: actions/checkout@v7
        with:
          repository: tzervas/webpuppet-rs
          path: webpuppet-rs

      - uses: actions/checkout@v7
        with:
          path: webpuppet-rs-mcp

      - name: Install system deps (host image may already have them)
        run: |
          set -euo pipefail
          if command -v pkg-config >/dev/null 2>&1 && pkg-config --exists libssl 2>/dev/null; then
            echo "libssl already available"
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
          elif [ "$(id -u)" -eq 0 ]; then
            apt-get update && apt-get install -y libssl-dev pkg-config
          else
            echo "no sudo and not root — assuming work image has OpenSSL headers"
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: webpuppet-mcp
          workspaces: webpuppet-rs-mcp

      - name: Local-parity checks
        working-directory: webpuppet-rs-mcp
        run: bash scripts/check.sh
