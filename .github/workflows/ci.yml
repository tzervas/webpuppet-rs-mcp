name: CI

on:
  push:
    branches: [main, dev, testing]
  pull_request:
    branches: [main, dev, testing]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: embeddenator-webpuppet-mcp
      
      - name: Check formatting
        run: cargo fmt --check
      
      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Build
        run: cargo build --all-features
      
      - name: Run tests
        run: cargo test --all-features --verbose

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run security audit
        run: cargo audit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
      
      - name: Build release binary
        run: cargo build --release
      
      - name: Run integration test script
        run: |
          chmod +x scripts/test_mcp_server.sh
          ./scripts/test_mcp_server.sh || true
      
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs/
          retention-days: 7

  # Optional: runs on self-hosted ARM64 runner if available
  build-arm64:
    name: Build (ARM64)
    runs-on: [self-hosted, linux, arm64]
    if: github.repository_owner == 'tzervas'
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: embeddenator-webpuppet-mcp-arm64
      
      - name: Build
        run: cargo build --all-features
      
      - name: Run tests
        run: cargo test --all-features
